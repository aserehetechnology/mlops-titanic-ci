name: ML Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
          
      - name: Check Env
        run: python --version && pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn

      - name: Set MLflow Tracking URI
        run: |
          echo "Setting MLflow tracking URI to local"

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . -P dataset=namadataset_preprocessing/titanic_processed.csv

      - name: Upload to GitHub
        uses: actions/upload-artifact@v3
        with:
          name: mlruns-artifacts
          path: MLProject/mlruns/

      - name: Build Docker Model
        run: |
          cd MLProject
          LATEST_RUN=$(ls -td mlruns/0/* | head -1)
          RUN_ID=$(basename $LATEST_RUN)
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "titanic-model:latest"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag titanic-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/titanic-model:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/titanic-model:latest
